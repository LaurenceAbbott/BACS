  return (
    <>This file doesn't match the {workflowLabel ? workflowLabel.replace(" file", "") : "selected"} format. Check you've selected the correct file type and try again.</>

}

/* ---------------------------------------------------------------------- */
/* Custom dropdown                                                        */
/* ---------------------------------------------------------------------- */
function FileTypeSelect({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function onDocClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, []);

  const options = [
    { key: "", label: "Select" },
    { key: "ARUDD", label: "ARUDD file" },
    { key: "COMBINED", label: "AUDDIS Return / ADDACS file" },
  ];

  const current = options.find(o => o.key === value) || options[0];

  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button
        type="button"
        onClick={() => setOpen(o => !o)}
        style={{
          width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "10px 12px", borderRadius: 8, border: `1px solid ${C.border}`,
          background: C.card, fontSize: 14, color: value ? C.text : "#8A909B",
          cursor: "pointer", fontFamily: font,
        }}
      >
        {current.label}
        <img src={ICON_CHEVRON_DOWN} alt="" style={{ width: 28, height: 28 }} />
      </button>

      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 2px)", left: 0, right: 0, zIndex: 20,
          background: C.card, border: `1px solid ${C.border}`, borderRadius: 8,
          boxShadow: "0 6px 16px rgba(15,18,25,0.12)", overflow: "hidden",
        }}>
          {options.map(o => {
            const isSelected = o.key === value;
            return (
              <div
                key={o.key || "placeholder"}
                onClick={() => { onChange(o.key); setOpen(false); }}
                style={{
                  padding: "10px 12px", fontSize: 14, cursor: "pointer",
                  background: isSelected ? C.blueDropdownHighlight : C.card,
                  color: isSelected ? "#FFFFFF" : C.text,
                }}
              >
                {o.label}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/* Main component                                                         */
/* ---------------------------------------------------------------------- */
function BacsImportV2() {
  const [stage, setStage] = useState("upload"); // upload | results | error
  const [workflowKey, setWorkflowKey] = useState("");
  const [pendingFile, setPendingFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [fileName, setFileName] = useState(null);
  const [isImporting, setIsImporting] = useState(false);
  const inputRef = useRef(null);

  const workflow = workflowKey ? WORKFLOWS[workflowKey] : null;

  const runImport = useCallback(() => {
    if (!workflowKey || !pendingFile) return;
    const name = pendingFile.name;
    setFileName(name);
    setIsImporting(true);
    setTimeout(() => {
      const forceError = /error|fail/i.test(name);
      setIsImporting(false);
      setStage(forceError ? "error" : "results");
    }, 2500);
  }, [workflowKey, pendingFile]);

  const resetToUpload = () => {
    setStage("upload"); setPendingFile(null); setFileName(null);
  };

  const page = {
    maxWidth: 364, margin: "0 auto", fontFamily: font, color: C.text,
  };
  const card = {
    background: C.card, border: `1px solid ${C.border}`, borderRadius: 14, padding: 32,
  };

  return (
    <div style={{ background: "#F5F6F8", minHeight: 500, padding: "40px 20px" }}>
      <div style={page}>
        <div style={card}>
          <h1 style={{ fontSize: 22, fontWeight: 700, margin: "0 0 6px", letterSpacing: -0.2 }}>Import files</h1>

          {stage === "upload" && (
            <>
              <p style={{ fontSize: 14, color: C.textSecondary, margin: "0 0 24px", lineHeight: 1.45 }}>
                Choose the type of file you've received from BACS.
              </p>

              <label style={{ fontSize: 13.5, fontWeight: 600, color: C.textLabel, marginBottom: 8, display: "block" }}>BACS file type</label>
              <FileTypeSelect value={workflowKey} onChange={(k) => { setWorkflowKey(k); setPendingFile(null); }} />

              {workflow && (
                <>
                  <div style={{ fontSize: 12.5, color: C.muted, marginTop: 8, lineHeight: 1.45 }}>{workflow.desc}</div>

                  <div
                    onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                    onDragLeave={() => setDragOver(false)}
                    onDrop={(e) => { e.preventDefault(); setDragOver(false); setPendingFile(e.dataTransfer.files && e.dataTransfer.files[0] ? e.dataTransfer.files[0] : null); }}
                    onClick={() => inputRef.current && inputRef.current.click()}
                    style={{
                      marginTop: 16,
                      border: pendingFile ? `1px solid ${C.border}` : `1.5px dashed ${dragOver ? C.blue : "#B9C0CC"}`,
                      borderRadius: 10, padding: pendingFile ? "16px 16px" : "30px 16px",
                      textAlign: pendingFile ? "left" : "center",
                      cursor: "pointer", background: dragOver ? "#EEF1FE" : (pendingFile ? "#FAFBFC" : C.card),
                      transition: "all .15s ease",
                    }}
                  >
                    <input ref={inputRef} type="file" style={{ display: "none" }}
                      onChange={(e) => setPendingFile(e.target.files && e.target.files[0] ? e.target.files[0] : null)} />
                    {pendingFile ? (
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <div style={{ fontSize: 14, fontWeight: 600 }}>{pendingFile.name}</div>
                        <button
                          onClick={(e) => { e.stopPropagation(); setPendingFile(null); }}
                          aria-label="Remove file"
                          style={{
                            background: "none", border: "none", cursor: "pointer", padding: 4,
                            display: "flex", alignItems: "center",
                          }}
                        ><img src={ICON_TRASH} alt="" style={{ width: 40, height: 40 }} /></button>
                      </div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                        <img src={ICON_UPLOAD} alt="" style={{ width: 18, height: 20.5 }} />
                        <div style={{ fontSize: 14, fontWeight: 600, color: C.blue }}>Drop files here</div>
                        <div style={{ fontSize: 12.5, color: C.muted }}>or click to browse</div>
                      </div>
                    )}
                  </div>
                </>
              )}

              <button
                onClick={runImport}
                disabled={!workflowKey || !pendingFile || isImporting}
                style={{
                  width: "100%", marginTop: 18, padding: "12px 0", borderRadius: 8, border: "none",
                  background: (!workflowKey || !pendingFile) ? C.blueDisabled : C.blue,
                  color: "#fff", fontSize: 14.5, fontWeight: 600, fontFamily: font,
                  cursor: (!workflowKey || !pendingFile || isImporting) ? "default" : "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                }}
              >
                {isImporting && <Loader2Icon size={15} style={{ animation: "spin 0.8s linear infinite" }} />}
                {isImporting ? "Importing…" : "Import"}
              </button>
              <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
            </>
          )}

          {stage === "results" && (
            <div style={{ marginTop: 4 }}>
              <img src={ICON_SUCCESS} alt="" style={{ width: 48, height: 48, marginBottom: 16, display: "block" }} />
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 14 }}>File successfully uploaded</div>
              <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 3 }}>{workflow && workflow.label}</div>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 18 }}>{fileName}</div>
              <div style={{ display: "flex", gap: 20 }}>
                <button onClick={resetToUpload} style={{
                  background: "none", border: "none", color: C.link, fontSize: 13.5, fontWeight: 600, cursor: "pointer", padding: 0, fontFamily: font,
                }}>Import another file</button>
                <span
                  title="Links to the Reports tab in the live system — not part of this prototype"
                  style={{ color: C.link, fontSize: 13.5, fontWeight: 600, cursor: "default" }}
                >View BACS record</span>
              </div>
            </div>
          )}

          {stage === "error" && (
            <div style={{ marginTop: 4 }}>
              <img src={ICON_ERROR} alt="" style={{ width: 48, height: 48, marginBottom: 16, display: "block" }} />
              <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 8 }}>File failed to upload</div>
              <p style={{ fontSize: 13.5, color: C.text, lineHeight: 1.5, margin: "0 0 18px", maxWidth: 320 }}>
                <ErrorMessage workflowLabel={workflow && workflow.label} />
              </p>
              <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 3 }}>{workflow && workflow.label}</div>
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 20 }}>{fileName}</div>
              <button onClick={resetToUpload} style={{
                width: "100%", padding: "12px 0", borderRadius: 8, border: "none", background: C.blue,
                color: "#fff", fontSize: 14.5, fontWeight: 600, fontFamily: font, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              }}><RotateCcwIcon size={14} /> Try again</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BacsImportV2 />);
</script>
</body>
</html>
